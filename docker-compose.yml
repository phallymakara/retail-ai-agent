services:
  backend:
    build:
      context: ./backend
    container_name: retail-backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80","http://127.0.0.1:80","http://frontend:80"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=/api
    container_name: retail-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
